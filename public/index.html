<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e11d2e"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg"><title>Central Auto</title><style>

e-between;align-items:center;margin-bottom:18px}.vehicles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:15px}.vehicle h3{margin:8px 0}.price{font-size:21px;font-weight:900}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--border);text-align:left}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#222733;font-size:12px}.ok{background:#10351f;color:#70e39b}.err{background:#3b1419;color:#ff8792}.warn{background:#3a2d0d;color:#f6ce6a}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:20px;z-index:10}.modalbox{width:min(850px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:22px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px}.full{grid-column:1/-1}.photo-list{display:flex;gap:10px;flex-wrap:wrap}.photo{width:100px;height:75px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}@media(max-width:850px){.side{width:75px;padding:14px}.side .brandtext,.side .nav span{display:none}.content{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top{padding:0 16px}}@media(max-width:600px){.side{position:fixed;bottom:0;top:auto;width:100%;height:62px;z-index:8;border-right:0;border-top:1px solid var(--border);display:flex}.nav{margin:0;display:flex;width:100%;justify-content:space-around}.nav button{font-size:11px;text-align:center}.main{padding-bottom:62px}.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.table{font-size:13px}.top{height:62px}}
</style></head><body><div id="root"></div><script src="/app.js"></script></body></html>
